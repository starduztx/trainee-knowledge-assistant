services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
    volumes:
      - ./prisma:/app/prisma
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
